; ==============================================================================
; hardlink-checker — Configuration
; ==============================================================================

[paths]
; Dossiers racines à scanner. Chaque clé devient le nom de la catégorie.
; Ajouter ou retirer des lignes selon votre setup.
animes  = /mnt/nas/Media/Downloads/Complet/animes
films   = /mnt/nas/Media/Downloads/Complet/films
series  = /mnt/nas/Media/Downloads/Complet/series

; ==============================================================================

[sonarr]
; Queue guard Sonarr : les torrents en attente d'import sont ignorés.
; Laisser url ou api_key vide pour désactiver.
url     = http://sonarr:8989
api_key =

[radarr]
; Queue guard Radarr : les torrents en attente d'import sont ignorés.
; Laisser url ou api_key vide pour désactiver.
url     = http://radarr:7878
api_key =

; ==============================================================================

[options]
; Extensions de fichiers media reconnues (séparées par des virgules).
media_extensions = .mkv, .mp4, .avi, .mov, .wmv, .m4v, .ts, .iso

; Afficher les entrées saines (nlink >= 2) dans le rapport.
show_ok = false

; Niveau de log affiché sur stderr : DEBUG, INFO, WARNING, ERROR
log_level = INFO

; Chemin du fichier de whitelist JSON.
; Laisser vide pour utiliser whitelist.json dans le même dossier que ce script.
whitelist_path =

; Désactiver tous les prompts interactifs (utile pour cron / exécution automatique).
; En mode no_interactive, les nouveaux MIXED ne sont PAS ajoutés à la whitelist.
no_interactive = false
